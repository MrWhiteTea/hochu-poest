<!doctype html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Хочу поесть — главная</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700&family=PT+Mono:wght@400;700&display=swap');

  :root {
    --cream: #f4ece0;
    --ink: #17110d;
    --accent: #d99a3a;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--ink); color: var(--cream);
    font-family: 'Montserrat', sans-serif;
    -webkit-font-smoothing: antialiased;
    overflow: hidden; touch-action: none;
  }
  h1 { margin: 0; text-wrap: balance; }
  .frame { position: fixed; inset: 14px; border: 1.5px solid rgba(244,236,224,0.28); pointer-events: none; z-index: 95; }

  .stage { position: relative; width: 100%; height: 100vh; overflow: hidden; }

  /* ---------- three windows, each masked to its own torn hole, each cycling its own 3 clips ---------- */
  .bg-video { position: absolute; inset: 0; z-index: 0; background: #2a0f14; }

  /* the mask wrapper stays full-viewport so mask-size:cover aligns pixel-for-pixel with the paper overlay */
  .hole-window {
    position: absolute; inset: 0; overflow: hidden;
    -webkit-mask-repeat: no-repeat; mask-repeat: no-repeat;
    -webkit-mask-size: cover; mask-size: cover;
    -webkit-mask-position: center; mask-position: center;
  }
  .hole-window-right     { -webkit-mask-image: url('assets/overlays/hole-right.png');     mask-image: url('assets/overlays/hole-right.png'); }
  .hole-window-upperleft { -webkit-mask-image: url('assets/overlays/hole-upperleft.png'); mask-image: url('assets/overlays/hole-upperleft.png'); }
  .hole-window-bottom    { -webkit-mask-image: url('assets/overlays/hole-bottom.png');    mask-image: url('assets/overlays/hole-bottom.png'); }

  /* each video is sized/positioned smaller than the viewport and centered on its own hole,
     so more of the clip's frame is visible through the tear instead of an extreme crop */
  .hw-video {
    position: absolute; object-fit: cover; object-position: center 35%; transform: translate(-50%, -50%);
    opacity: 0; transition: opacity 1.3s ease-in-out;
  }
  .hw-video.active { opacity: 1; }

  /* box must be at least as tall/wide as the actual tear it sits behind (checked against
     each hole's real bbox: right 30.1%x70.8%, upperleft 41.6%x45.5%, bottom 32.8%x34.0%
     of the source canvas) plus a safety margin — undershooting leaves a flat gap of bare
     background showing through part of the tear instead of footage */
  .hole-window-right     .hw-video { left: 82%; top: 46%; width: 46%; height: 86%; }
  .hole-window-upperleft .hw-video { left: 22%; top: 28%; width: 54%; height: 58%; }
  .hole-window-bottom    .hw-video { left: 49%; top: 75%; width: 44%; height: 46%; }

  /* ---------- torn burgundy paper, genuinely transparent tears, footage shows through ---------- */
  .tear-overlay {
    position: absolute; inset: 0; z-index: 1;
    background-image: url('assets/overlays/tear-overlay-8-final.webp');
    background-size: cover; background-position: center;
    pointer-events: none;
  }

  /* ---------- hero text: fades out cleanly as one block before the menu appears ---------- */
  .hero-copy {
    position: absolute; inset: 0; z-index: 3; display: flex; flex-direction: column; align-items: center;
    padding: 6vh 24px; text-align: center;
    pointer-events: none;
    opacity: 1; transition: opacity 1.8s ease;
  }
  .hero-copy.fade-out { opacity: 0; }
  .eyebrow {
    font-family: 'PT Mono', monospace; font-size: 11.5px; letter-spacing: 0.09em; text-transform: uppercase;
    color: var(--cream); opacity: 0.75; display: flex; gap: 12px; align-items: center;
    text-shadow: 0 2px 10px rgba(0,0,0,0.6);
  }
  .eyebrow b { color: var(--accent); opacity: 1; }

  .hero-bottom { margin-top: auto; margin-bottom: auto; display: flex; flex-direction: column; align-items: center; }

  .text-scrim { position: relative; }
  .text-scrim::before {
    content: "";
    position: absolute;
    inset: -20% -18%;
    background: radial-gradient(ellipse 50% 50% at 50% 50%,
      rgba(0,0,0,0.42) 0%, rgba(0,0,0,0.26) 42%, rgba(0,0,0,0.1) 68%, rgba(0,0,0,0) 90%);
    z-index: -1;
    pointer-events: none;
  }

  .wordmark {
    font-size: clamp(38px, 8vw, 84px); font-weight: 500; text-transform: uppercase;
    letter-spacing: 0.08em; line-height: 1.05; color: var(--cream);
    text-shadow: 0 4px 24px rgba(0,0,0,0.55);
  }
  .tagline {
    font-weight: 400; letter-spacing: 0.01em;
    font-size: clamp(13.5px, 1.5vw, 16px); color: var(--accent); opacity: 0.95;
    max-width: 38ch; margin: 14px auto 0; text-align: center;
    text-shadow: 0 2px 10px rgba(0,0,0,0.6);
  }

  .corners {
    position: absolute; left: 34px; right: 34px; bottom: 24px; z-index: 4;
    display: flex; justify-content: space-between;
    font-family: 'PT Mono', monospace; font-size: 10.5px; letter-spacing: 0.07em; text-transform: uppercase;
    color: var(--cream); opacity: 0.6; text-shadow: 0 2px 8px rgba(0,0,0,0.6);
  }
  .corners .l { color: var(--accent); opacity: 1; }

  /* ---------- menu (revealed, same footage behind) ---------- */
  .menu-layer {
    position: absolute; inset: 0; z-index: 2;
    background: linear-gradient(180deg, rgba(23,17,13,0.15) 0%, rgba(23,17,13,0.55) 55%, rgba(23,17,13,0.88) 100%);
    display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 24px;
    opacity: 0; pointer-events: none;
    transition: opacity 1.1s ease-in-out;
    perspective: 1000px;
  }
  .back {
    position: absolute; top: 30px; left: 34px;
    font-family: 'PT Mono', monospace; font-size: 12px; letter-spacing: 0.06em; text-transform: uppercase;
    color: var(--cream); background: none; border: none; cursor: pointer; opacity: 0.75;
  }
  .back:hover { opacity: 1; }
  .menu-eyebrow {
    font-family: 'PT Mono', monospace; font-size: 11.5px; letter-spacing: 0.09em; text-transform: uppercase;
    color: var(--cream); opacity: 0.6; margin-bottom: 24px;
  }
  .menu-list {
    display: flex; flex-direction: column; gap: 8px; width: min(92vw, 480px);
    transform-style: preserve-3d; transition: transform .15s ease-out;
  }
  .menu-item {
    position: relative;
    display: flex; align-items: baseline; gap: 16px; padding: 15px 18px;
    background: rgba(23,17,13,0.55); backdrop-filter: blur(6px); border: 1px solid rgba(244,236,224,0.16);
    transition: background .18s ease, padding-left .18s ease, box-shadow .5s ease,
      transform 1.1s cubic-bezier(.22,1,.36,1), opacity 1.1s cubic-bezier(.22,1,.36,1);
    text-decoration: none; cursor: pointer;
  }
  .menu-item .label { font-weight: 600; font-size: clamp(19px, 3.2vw, 27px); letter-spacing: 0.02em; text-transform: uppercase; flex: 1; text-align: left; color: var(--cream); }
  .menu-item .soon { font-family: 'PT Mono', monospace; font-size: 10.5px; color: var(--cream); opacity: 0.5; text-transform: uppercase; }
  .menu-item:hover {
    background: rgba(23,17,13,0.72); padding-left: 22px;
    box-shadow: 0 0 36px rgba(217,154,58,0.45), 0 0 70px rgba(217,154,58,0.2);
  }

  /* hover: two golden lines trace the border starting from the top-left corner —
     one running right-then-down, the other down-then-right — meeting at the
     bottom-right corner once both finish, over ~0.3s */
  .mi-border { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; pointer-events: none; }
  .mi-line {
    fill: none; stroke: var(--accent); stroke-width: 1.5px; vector-effect: non-scaling-stroke;
    stroke-dasharray: 1 1; stroke-dashoffset: 1;
    transition: stroke-dashoffset .3s linear;
  }
  .menu-item:hover .mi-line { stroke-dashoffset: 0; }

  /* clean staggered fade-up: each row is its own smooth 0%->100% opacity fade with a gentle
     rise, triggered a clear step after the previous one — reads as distinct steps, never a
     sudden pop, whole sequence lands in ~2.3s.
     The per-row entrance delay is applied ONLY to transform/opacity, spelled out per
     property rather than as a bare `transition-delay` override — a bare override applies
     its one value to every transitioned property (background, box-shadow, ...), which was
     silently delaying rows 2-4's hover glow by their entrance delay too (row 4 effectively
     took 1.45s+ to light up and felt broken). background/padding-left/box-shadow keep a
     flat 0s delay on every row so hover response is identical regardless of entrance order. */
  .menu-item { transform: translateY(18px) translateZ(var(--z, 0px)); opacity: 0; }
  .menu-layer.in .menu-item {
    transform: translateY(0) translateZ(var(--z, 0px)); opacity: 1;
    transition: background .18s ease 0s, padding-left .18s ease 0s, box-shadow .5s ease 0s,
      transform 1.1s cubic-bezier(.22,1,.36,1) var(--enter-delay, 0s),
      opacity 1.1s cubic-bezier(.22,1,.36,1) var(--enter-delay, 0s);
  }
  .menu-layer.in .menu-item:nth-child(1) { --enter-delay: .1s; }
  .menu-layer.in .menu-item:nth-child(2) { --enter-delay: .55s; }
  .menu-layer.in .menu-item:nth-child(3) { --enter-delay: 1s; }
  .menu-layer.in .menu-item:nth-child(4) { --enter-delay: 1.45s; }

  /* plate + layers: each row sits at a slightly different resting depth, so tilting
     the whole list (via JS below) reveals a real stack of cards, not a flat sheet.
     Kept entirely non-negative — a negative translateZ here (rows pushed behind the
     rest-plane) broke real click/hover hit-testing on those rows in testing, so the
     whole range sits at or in front of zero instead. */
  .menu-item:nth-child(1) { --z: 10px; }
  .menu-item:nth-child(2) { --z: 6px; }
  .menu-item:nth-child(3) { --z: 3px; }
  .menu-item:nth-child(4) { --z: 0px; }

</style>
</head>
<body>

<div class="frame"></div>

<div class="stage" id="stage">
  <div class="bg-video" id="bgVideo">
    <div class="hole-window hole-window-right" data-start="0">
      <video class="hw-video" muted playsinline preload="auto"></video>
      <video class="hw-video" muted playsinline preload="auto"></video>
    </div>
    <div class="hole-window hole-window-upperleft" data-start="3">
      <video class="hw-video" muted playsinline preload="auto"></video>
      <video class="hw-video" muted playsinline preload="auto"></video>
    </div>
    <div class="hole-window hole-window-bottom" data-start="7">
      <video class="hw-video" muted playsinline preload="auto"></video>
      <video class="hw-video" muted playsinline preload="auto"></video>
    </div>
  </div>
  <div class="tear-overlay"></div>

  <section class="menu-layer" id="menuLayer">
    <button class="back" id="backBtn" type="button">← Назад</button>
    <div class="menu-eyebrow">Основное меню</div>
    <nav class="menu-list">
      <a class="menu-item" href="prototype.html"><span class="label">Заведения</span><span class="soon">каталог</span><svg class="mi-border" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true"><path class="mi-line" d="M0,0 L100,0 L100,100" pathLength="1"/><path class="mi-line" d="M0,0 L0,100 L100,100" pathLength="1"/></svg></a>
      <div class="menu-item"><span class="label">О проекте</span><span class="soon">скоро</span><svg class="mi-border" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true"><path class="mi-line" d="M0,0 L100,0 L100,100" pathLength="1"/><path class="mi-line" d="M0,0 L0,100 L100,100" pathLength="1"/></svg></div>
      <div class="menu-item"><span class="label">Мы в ВК</span><span class="soon">скоро</span><svg class="mi-border" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true"><path class="mi-line" d="M0,0 L100,0 L100,100" pathLength="1"/><path class="mi-line" d="M0,0 L0,100 L100,100" pathLength="1"/></svg></div>
      <div class="menu-item"><span class="label">Написать нам</span><span class="soon">скоро</span><svg class="mi-border" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true"><path class="mi-line" d="M0,0 L100,0 L100,100" pathLength="1"/><path class="mi-line" d="M0,0 L0,100 L100,100" pathLength="1"/></svg></div>
    </nav>
  </section>

  <div class="hero-copy" id="heroCopy">
    <div class="eyebrow" id="eyebrowText"><span>Краснодар</span><b>·</b><span>Выпуск 01</span></div>
    <div class="hero-bottom">
      <div class="text-scrim">
        <h1 class="wordmark" id="wordmarkText">Хочу поесть</h1>
        <p class="tagline" id="taglineText">Точный подбор заведения Краснодара под то, что нужно сейчас</p>
      </div>
    </div>
  </div>

  <div class="corners"><span class="l">краснодар · 2026</span><span>черновик главной</span></div>
</div>

<script>
  // ---------- shared pool of 10 clips (each file appears exactly once in this array, so
  // publishing embeds it exactly once no matter how many <video> tags end up playing it) ----------
  const CLIP_POOL = [
    'assets/video/clip1.mp4',
    'assets/video/clip2.mp4',
    'assets/video/clip3.mp4',
    'assets/video/clip4.mp4',
    'assets/video/clip5.mp4',
    'assets/video/clip6.mp4',
    'assets/video/clip7.mp4',
    'assets/video/clip8.mp4',
    'assets/video/clip9.mp4',
    'assets/video/clip10.mp4',
  ];

  // ---------- each torn window is a 2-video double buffer: one plays while the other
  // preloads the next clip from the shared pool, then they crossfade — always a different
  // clip playing, never a reload flash. Each window starts at its own offset in the pool. ----------
  (function () {
    document.querySelectorAll('.hole-window').forEach(win => {
      const [a, b] = win.querySelectorAll('.hw-video');
      if (!a || !b) return;
      let poolIdx = parseInt(win.dataset.start || '0', 10) % CLIP_POOL.length;
      let active = a, standby = b;

      active.src = CLIP_POOL[poolIdx];
      poolIdx = (poolIdx + 1) % CLIP_POOL.length;
      standby.src = CLIP_POOL[poolIdx];

      active.classList.add('active');
      active.play().catch(() => {});

      function advance() {
        standby.currentTime = 0;
        standby.play().catch(() => {});
        standby.classList.add('active');
        active.classList.remove('active');
        [active, standby] = [standby, active];
        poolIdx = (poolIdx + 1) % CLIP_POOL.length;
        standby.src = CLIP_POOL[poolIdx];
      }

      a.addEventListener('ended', advance);
      b.addEventListener('ended', advance);
    });
  })();

  const heroCopy = document.getElementById('heroCopy');
  const menuLayer = document.getElementById('menuLayer');

  // hero text fades out cleanly as one block (1.5-2s), THEN the menu cascades in —
  // two distinct, sequential beats rather than everything happening at once.
  // (Intentionally not gated behind prefers-reduced-motion: this is a personal draft
  // and the motion itself is the explicit point, not an incidental flourish.)
  const HERO_FADE_MS = 1800;
  const MENU_CASCADE_MS = 2550; // last menu item's delay(1.45s) + its own duration(1.1s)
  const totalMs = HERO_FADE_MS + MENU_CASCADE_MS;

  let state = 'idle'; // idle | fading | menu

  function openMenu() {
    if (state !== 'idle') return;
    state = 'fading';
    heroCopy.classList.add('fade-out');
    setTimeout(() => {
      state = 'menu';
      menuLayer.style.opacity = '1';
      menuLayer.style.pointerEvents = 'auto';
      menuLayer.classList.add('in');
    }, HERO_FADE_MS);
  }

  function closeMenu() {
    if (state === 'idle') return;
    state = 'idle';
    heroCopy.classList.remove('fade-out');
    menuLayer.classList.remove('in');
    menuLayer.style.pointerEvents = 'none';
    menuLayer.style.opacity = '0';
    menuList.style.transform = '';
  }

  // ---------- plate + layers: the whole menu list tilts as one rigid plate toward the
  // cursor, and each row's own resting Z-depth (set in CSS) turns that tilt into a
  // visible stack of cards rather than a flat sheet rotating ----------
  const menuList = document.querySelector('.menu-list');
  const TILT_MAX_DEG = 6;
  menuLayer.addEventListener('mousemove', (e) => {
    if (state !== 'menu') return;
    const r = menuList.getBoundingClientRect();
    const nx = Math.max(-1, Math.min(1, (e.clientX - (r.left + r.width / 2)) / (r.width / 2)));
    const ny = Math.max(-1, Math.min(1, (e.clientY - (r.top + r.height / 2)) / (r.height / 2)));
    menuList.style.transform = `rotateY(${(nx * TILT_MAX_DEG).toFixed(2)}deg) rotateX(${(-ny * TILT_MAX_DEG).toFixed(2)}deg)`;
  });
  menuLayer.addEventListener('mouseleave', () => {
    menuList.style.transform = '';
  });

  const CLOSE_MS = 1800 + 400; // matches the hero fade-back-in duration

  let wheelLocked = false;
  window.addEventListener('wheel', (e) => {
    if (wheelLocked) return;
    if (e.deltaY > 12 && state === 'idle') {
      wheelLocked = true;
      openMenu();
      setTimeout(() => { wheelLocked = false; }, totalMs + 400);
    } else if (e.deltaY < -12 && state === 'menu') {
      wheelLocked = true;
      closeMenu();
      setTimeout(() => { wheelLocked = false; }, CLOSE_MS);
    }
  }, { passive: true });

  document.getElementById('backBtn').addEventListener('click', closeMenu);
</script>
</body>
</html>
